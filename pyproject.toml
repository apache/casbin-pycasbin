[project]
name = "apache-casbin"
version = "2.9.0"
authors = [
    {name = "Apache Casbin (Incubating)", email = "dev@casbin.apache.org"},
    {name = "Casbin", email = "admin@casbin.org"},
]
description = "Apache Casbin (Incubating): authorization for Python with ACL, RBAC and ABAC models"
readme = "README.md"
keywords = [
    "casbin",
    "pycasbin",
    "acl",
    "rbac",
    "abac",
    "auth",
    "authz",
    "authorization",
    "access control",
    "permission",
]
dynamic = ["dependencies"]
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "DISCLAIMER"]
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://casbin.apache.org/"
Documentation = "https://casbin.apache.org/docs/overview/"
Repository = "https://github.com/apache/casbin-pycasbin"
Issues = "https://github.com/apache/casbin-pycasbin/issues"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["casbin", "casbin.*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.black]
line-length = 120
