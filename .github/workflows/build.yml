name: build
permissions:
  contents: read
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macOS-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout conformance cases
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: apache/casbin
          ref: 6a018f27246f5f270f6cfa6ca3e8c82f45812bec
          path: casbin-conformance
          sparse-checkout: conformance

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_dev.txt
          pip install coveralls

      - name: Run tests
        run: coverage run -m unittest discover -s tests -t tests
        env:
          CASBIN_CONFORMANCE_DIR: ${{ github.workspace }}/casbin-conformance/conformance

      - name: Run benchmark
        if: matrix.python-version != '3.9'
        run: python3 -m pytest
          --benchmark-verbose
          --benchmark-columns=mean,stddev,iqr,ops,rounds
          tests/benchmarks/benchmark_model.py
          tests/benchmarks/benchmark_management_api.py
          tests/benchmarks/benchmark_role_manager.py
          tests/benchmarks/benchmark_adapter.py

      - name: Upload coverage data to coveralls.io
        run: coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_FLAG_NAME: ${{ matrix.os }} - ${{ matrix.python-version }}
          COVERALLS_PARALLEL: true

  lint:
    name: Run Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install black
        run: python -m pip install -r requirements_dev.txt

      - name: Check formatting with black
        run: black --check --diff .

      - name: Test release verification safeguards
        run: python -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Build and inspect Python distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          python .github/scripts/release.py python-check dist/*.whl
          python .github/scripts/release.py python-check dist/*.tar.gz

  coveralls:
    name: Indicate completion to coveralls.io
    needs: test
    runs-on: ubuntu-latest
    container: python:3-slim
    steps:
      - name: Finished
        run: |
          pip3 install --upgrade coveralls
          coveralls --finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
